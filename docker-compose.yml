services:
  reflector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: can-i-haz-reachability-server
    ports:
      # Bind to loopback only: the service is meant to sit behind the reverse
      # proxy. Publishing on 0.0.0.0 exposes an unauthenticated, TLS-less path
      # around Caddy (and around its client-IP handling).
      - "127.0.0.1:8080:8080"
    networks:
      - nginx-network
      - default
    volumes:
      - logs:/logs
    environment:
      - REFLECTOR_PORT=8080
      - REFLECTOR_TIMEOUT=5s
      - REFLECTOR_ALLOWED_PORTS=22,80,443,8080,8443
      - REFLECTOR_RATE_LIMIT_PER_MIN=10
      - REFLECTOR_LOG_DIR=/logs
    restart: unless-stopped
    # Hardening (matches the Podman quadlet in deploy/podman)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    # Increase file descriptor limit for many concurrent connections
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  logs:

networks:
  nginx-network:
    external: true
  default:
    driver: bridge
    enable_ipv6: true